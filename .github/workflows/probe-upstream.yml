# TEMPORARY diagnostic — not part of the pipeline, delete once the matrix is
# known. Hand-written on purpose: it carries no `# Generated by ocx-mirror`
# header, so the drift guard ignores it.
#
# Round 2: upstream's osx-arm64 and windows builds have no `--version` flag
# from 0.6.2 on. Does the LSP session — the actual contract — still work on
# them, and does the server start with no arguments?
name: probe-upstream
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, asset: osx-arm64, ext: "" }
          - { runner: windows-latest, asset: windows-amd64.exe, ext: ".exe" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Probe LSP session
        shell: bash
        run: |
          set +e
          cat > drive.py <<'PY'
          import json, subprocess, sys
          def frame(o):
              b = json.dumps(o).encode()
              return b"Content-Length: %d\r\n\r\n" % len(b) + b
          msgs = (frame({"jsonrpc":"2.0","id":1,"method":"initialize",
                         "params":{"processId":None,"rootUri":None,"capabilities":{}}})
                + frame({"jsonrpc":"2.0","method":"initialized","params":{}})
                + frame({"jsonrpc":"2.0","id":2,"method":"shutdown"})
                + frame({"jsonrpc":"2.0","method":"exit"}))
          p = subprocess.run([sys.argv[1]], input=msgs, capture_output=True, timeout=60)
          out = p.stdout.decode("utf-8", "replace")
          print("rc=%s definitionProvider=%s completionProvider=%s hoverProvider=%s id2=%s"
                % (p.returncode, '"definitionProvider"' in out, '"completionProvider"' in out,
                   '"hoverProvider"' in out, '"id":2' in out))
          print("stderr:", p.stderr.decode("utf-8", "replace")[:200].replace("\n", " | "))
          PY
          for v in 0.6.0 0.6.1 0.6.2 0.6.3 0.6.4; do
            url="https://github.com/cameron-martin/bazel-lsp/releases/download/v${v}/bazel-lsp-${v}-${{ matrix.asset }}"
            if ! curl -sfL -o "tool${{ matrix.ext }}" "$url"; then
              echo "RESULT ${{ matrix.asset }} $v ASSET-ABSENT"; continue
            fi
            chmod +x "tool${{ matrix.ext }}" || true
            echo "RESULT ${{ matrix.asset }} $v $(python3 drive.py "./tool${{ matrix.ext }}" 2>&1 | tr '\n' ' ')"
          done

# TEMPORARY diagnostic — not part of the pipeline, delete once the matrix is
# known. Hand-written on purpose: it carries no `# Generated by ocx-mirror`
# header, so the drift guard ignores it.
#
# Question it answers: which (version, platform) pairs of upstream's release
# assets actually accept `--version`? CI answers one pair per run because a red
# test aborts the job; this answers all of them in one go.
name: probe-upstream
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, asset: osx-arm64, ext: "" }
          - { runner: macos-14, asset: osx-amd64, ext: "", prefix: "arch -x86_64" }
          - { runner: windows-latest, asset: windows-amd64.exe, ext: ".exe" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e   # a nonzero --version rc IS the measurement, not a failure
          for v in 0.6.0 0.6.1 0.6.2 0.6.3 0.6.4; do
            url="https://github.com/cameron-martin/bazel-lsp/releases/download/v${v}/bazel-lsp-${v}-${{ matrix.asset }}"
            if ! curl -sfL -o "tool${{ matrix.ext }}" "$url"; then
              echo "${{ matrix.asset }} $v ASSET-ABSENT"; continue
            fi
            chmod +x "tool${{ matrix.ext }}" || true
            out=$(${{ matrix.prefix }} "./tool${{ matrix.ext }}" --version 2>&1); rc=$?
            echo "${{ matrix.asset }} $v --version rc=$rc :: $(echo "$out" | head -1)"
            out=$(${{ matrix.prefix }} "./tool${{ matrix.ext }}" --help 2>&1); rc=$?
            echo "${{ matrix.asset }} $v --help    rc=$rc :: $(echo "$out" | grep -c version) version-mentions"
          done
